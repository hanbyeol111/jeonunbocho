<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>전운보초</title>

  <!-- PWA로 설치 가능하게 만들어주는 설정 파일 -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#fee500" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 첫 화면: 지도 없이 뜨는 홈 화면. 여기서 카드를 골라야 지도 화면(#map-screen)으로 넘어간다. -->
  <div id="home-screen" class="home-screen">
    <header class="home-header">
      <h1>오늘의 연습</h1>
    </header>

    <p class="home-greeting">안녕하세요!</p>
    <p class="home-question">오늘은 어떤 연습을 할까요?</p>
    <p id="home-status" class="tab-placeholder hidden"></p>

    <div class="home-grid">
      <button id="home-card-destination" type="button" class="home-card">
        <span class="home-card-dot"></span>
        <span class="home-card-title">목적지 지정</span>
        <span class="home-card-subtitle">가고 싶은 곳으로</span>
      </button>

      <button id="home-card-loop" type="button" class="home-card">
        <span class="home-card-dot"></span>
        <span class="home-card-title">순환형 코스</span>
        <span class="home-card-subtitle">20분 · 5km</span>
      </button>

      <button type="button" class="home-card disabled" disabled>
        <span class="home-card-badge">준비 중</span>
        <span class="home-card-dot muted"></span>
        <span class="home-card-title">특정 요소</span>
        <span class="home-card-subtitle">유턴 · 합류 · 차선변경</span>
      </button>

      <button id="home-card-reports" type="button" class="home-card">
        <span class="home-card-dot"></span>
        <span class="home-card-title">내 리포트</span>
        <span class="home-card-subtitle">주행 기록 보기</span>
      </button>
    </div>

    <h2 class="home-section-title">추천 코스</h2>

    <div class="recommend-card">
      <span class="recommend-badge">LV.2 · 5km 코스</span>
      <p class="recommend-title">도심 순환 코스</p>
      <p class="recommend-stats">5.0km · 약 20분 · 무작위 방향</p>
      <button id="recommend-start-btn" type="button" class="primary-btn">시작하기</button>
    </div>
  </div>

  <!-- 지도 화면: 홈 화면에서 카드를 고르기 전까지는 숨겨져 있다. -->
  <div id="map-screen" class="map-screen hidden">

  <!-- 지도가 전체 화면을 채우는 배경 레이어. 나머지 UI는 전부 이 위에 떠 있다. -->
  <div id="map"></div>

  <!-- 상단 떠 있는 타이틀 바. 주행 중에는 대신 안내 배너(.nav-top-banner)가 이 자리를 대신하므로 숨긴다. -->
  <header id="app-header" class="app-header">
    <button id="back-to-home-btn" type="button" class="back-to-home-btn" aria-label="홈으로">←</button>
    <h1>전운보초</h1>
  </header>

  <!-- 주행 중 비보호좌회전/유턴 등 앞두고 뜨는 주의 안내 배너 -->
  <div id="caution-banner" class="caution-banner hidden"></div>

  <!-- 지도 위에 떠 있는 하단 시트. 안의 섹션들을 상황에 따라 보였다 숨겼다 한다. 주행 중에는 통째로 숨긴다. -->
  <div id="bottom-sheet" class="bottom-sheet">
    <div class="sheet-handle"></div>

    <!-- 코스 시작 전: 목적지 지정 / 순환코스 / 내 리포트 보기 3개 탭으로 나뉜다 -->
    <section id="setup-panel" class="sheet-section">
      <div id="start-tabs" class="start-tabs" role="tablist">
        <button type="button" class="start-tab" data-tab="destination" role="tab" aria-selected="false">목적지 지정</button>
        <button type="button" class="start-tab active" data-tab="loop" role="tab" aria-selected="true">순환코스</button>
        <button type="button" class="start-tab" data-tab="reports" role="tab" aria-selected="false">내 리포트 보기</button>
      </div>

      <!-- 목적지 지정: 장소를 검색해서 골라 편도 경로를 만든다 -->
      <div id="tab-destination" class="start-tab-panel hidden">
        <div class="destination-search-row">
          <input
            id="destination-search-input"
            type="search"
            inputmode="search"
            placeholder="주소, 건물명, 상호명으로 검색"
            class="destination-search-input"
          />
          <button id="destination-search-btn" type="button" class="secondary-btn destination-search-btn">검색</button>
        </div>
        <ul id="destination-results" class="destination-results"></ul>
        <p id="destination-search-empty" class="tab-placeholder hidden">검색 결과가 없어요.</p>
      </div>

      <!-- 순환코스: 기존 "순환 코스 설정" 다이얼로그를 여는 버튼 -->
      <div id="tab-loop" class="start-tab-panel">
        <button id="open-dialog-btn" type="button" class="primary-btn">순환 코스 설정</button>
      </div>

      <!-- 내 리포트 보기: 완주한 코스의 리포트 기록을 모아서 보여준다 -->
      <div id="tab-reports" class="start-tab-panel hidden">
        <ul id="report-history-list" class="report-history-list"></ul>
        <p id="report-history-empty" class="tab-placeholder">아직 완주한 코스가 없어요.</p>
      </div>

      <p id="status-msg" class="status"></p>
    </section>

    <!-- 경로를 만든 직후: 출발 전 브리핑 (썸네일 + 통계 + 주의구간 요약) -->
    <section id="briefing-panel" class="sheet-section hidden">
      <h2>주행 브리핑</h2>
      <div id="route-thumb" class="route-thumb"></div>
      <p id="briefing-text" class="briefing-summary"></p>

      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-label">좌회전</span>
          <span id="stat-left" class="stat-value">0회</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">우회전</span>
          <span id="stat-right" class="stat-value">0회</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">유턴</span>
          <span id="stat-uturn" class="stat-value">0회</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">차선변경</span>
          <span id="stat-lane" class="stat-value">약 0회</span>
        </div>
      </div>

      <div id="caution-summary" class="caution-summary hidden">
        <strong id="caution-summary-title"></strong>
        <p id="caution-summary-detail"></p>
      </div>

      <button id="briefing-start-btn" type="button" class="primary-btn">이 코스로 시작</button>
    </section>

    <section id="report-panel" class="sheet-section hidden">
      <h2>주행 리포트</h2>
      <p id="report-text"></p>
    </section>
  </div>

  <!-- 실제 주행 중: 지도는 계속 보여주고, 그 위에 안내 배너/버튼/하단 바만 띄운다 (네이버지도 내비 스타일 참고) -->
  <div id="nav-screen" class="nav-overlay hidden">
    <!-- 상단 안내 배너: 회전 아이콘 + 거리 + 방향, 그 아래 작은 글씨로 상세 안내 -->
    <div class="nav-top-banner">
      <span id="nav-big-arrow" class="nav-arrow-icon">⬆</span>
      <div class="nav-top-text">
        <p class="nav-headline"><span id="nav-distance">-- m</span> <span id="nav-turn-label"></span></p>
        <p id="nav-instruction" class="nav-instruction-sub"></p>
      </div>
    </div>

    <!-- 오른쪽 확대/축소 -->
    <div class="nav-side-controls">
      <button id="nav-zoom-in-btn" type="button" class="nav-side-btn" aria-label="확대">+</button>
      <button id="nav-zoom-out-btn" type="button" class="nav-side-btn" aria-label="축소">−</button>
    </div>

    <!-- 내 위치로 재중심 -->
    <button id="nav-recenter-btn" type="button" class="nav-recenter-btn">◎ 내 위치로</button>

    <!-- 하단 바: 남은 거리/도착 예정 + 종료 버튼 (창처럼 크게 뜨지 않고 얇게) -->
    <div class="nav-bottom-bar">
      <button id="nav-stop-btn" type="button" class="nav-bottom-icon-btn" aria-label="주행 중단">✕</button>
      <div class="nav-bottom-info">
        <span id="nav-summary" class="nav-summary"></span>
        <span id="nav-eta" class="nav-eta"></span>
      </div>
    </div>
  </div>

  </div> <!-- /#map-screen -->

  <!-- 순환 코스를 직접 설정하는 다이얼로그: 거리 + 방향을 고른다 -->
  <dialog id="course-dialog" class="course-dialog">
    <h2>순환 코스 설정</h2>

    <label>코스 거리</label>
    <!-- 알람 시간 맞추듯 스크롤해서 고르는 휠 피커. 값은 js/app.js가 채워 넣는다. -->
    <div class="wheel-picker-frame">
      <div class="wheel-highlight"></div>
      <div id="distance-picker" class="wheel-picker"></div>
    </div>

    <label>어느 방향으로 돌아볼까요?</label>
    <div id="direction-grid" class="direction-grid">
      <button type="button" class="dir-btn" data-bearing="315">↖<br />북서</button>
      <button type="button" class="dir-btn" data-bearing="0">↑<br />북</button>
      <button type="button" class="dir-btn" data-bearing="45">↗<br />북동</button>

      <button type="button" class="dir-btn" data-bearing="270">←<br />서</button>
      <button type="button" class="dir-btn selected" data-bearing="random">🎲<br />무작위</button>
      <button type="button" class="dir-btn" data-bearing="90">→<br />동</button>

      <button type="button" class="dir-btn" data-bearing="225">↙<br />남서</button>
      <button type="button" class="dir-btn" data-bearing="180">↓<br />남</button>
      <button type="button" class="dir-btn" data-bearing="135">↘<br />남동</button>
    </div>

    <button id="dialog-start-btn" type="button" class="primary-btn">경로 만들기</button>
    <button id="dialog-cancel-btn" type="button" class="secondary-btn">취소</button>
  </dialog>

  <!--
    카카오맵 JavaScript 키를 아래 KAKAO_APP_KEY 자리에 넣으세요.
    발급 방법: 전운보초_실행계획_Phase0-1.md 의 Phase 0 - 2번 참고.
  -->
  <script>
    const KAKAO_APP_KEY = "e47ef0296de555de9d3bc42f45f22b14";
  </script>
  <!--
    앱 키를 URL에 넣어서 SDK를 불러와야 하므로, 정적 <script src>가 아니라
    JS로 스크립트 태그를 동적으로 만들어 삽입한다.
  -->
  <script>
    // async를 꺼서 로드 순서를 보장하고, 로드가 끝난 뒤에야 app.js를 붙인다.
    // (그래야 app.js 안에서 kakao 객체를 안전하게 쓸 수 있다.)
    const sdkScript = document.createElement("script");
    // libraries=services -> 장소 검색(kakao.maps.services.Places)을 쓰기 위해 필요하다.
    sdkScript.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_APP_KEY}&libraries=services&autoload=false`;
    sdkScript.async = false;
    sdkScript.onload = () => {
      const appScript = document.createElement("script");
      appScript.src = "js/app.js";
      document.body.appendChild(appScript);
    };
    sdkScript.onerror = () => {
      const message =
        "카카오맵 SDK 로드 실패. 개발자도구 Network 탭에서 sdk.js 요청의 상태 코드를 확인하세요 (키 또는 등록된 도메인을 다시 확인).";
      const statusMsg = document.getElementById("status-msg");
      if (statusMsg) statusMsg.textContent = message;
      // 홈 화면은 지도 화면과 별개 화면이라, 실패 메시지를 홈 화면에도 따로 보여줘야 한다.
      const homeStatus = document.getElementById("home-status");
      if (homeStatus) {
        homeStatus.textContent = message;
        homeStatus.classList.remove("hidden");
      }
    };
    document.head.appendChild(sdkScript);
  </script>
</body>
</html>
